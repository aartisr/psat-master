<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient matching existing site theme -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    
    <!-- Gold / Amber Accent for the Guiding Spark (Aarti = wisdom/light) -->
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Electric Blue Glow Gradient -->
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Filter for Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="4" />
  
  <!-- Subtle learning geometric grids/orbits -->
  <circle cx="256" cy="256" r="220" stroke="rgba(255, 255, 255, 0.05)" stroke-width="4" fill="none" />
  <circle cx="256" cy="256" r="190" stroke="rgba(56, 189, 248, 0.1)" stroke-width="2" stroke-dasharray="12 12" fill="none" />

  <!-- Monogram A + P Structure -->
  <g transform="translate(0, 10)">
    <!-- Stem of A and Left Leg -->
    <path d="M 160 350 L 256 120 L 352 350" 
          stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Crossbar of A -->
    <path d="M 200 250 L 312 250" 
          stroke="#ffffff" stroke-width="28" stroke-linecap="round" fill="none" />

    <!-- Loop of P branching from the central stem of A -->
    <path d="M 256 120 C 335 120, 375 160, 375 210 C 375 265, 325 295, 256 295" 
          stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Guiding Spark of Wisdom / Academic Light (Aarti) at the Peak of A -->
  <g transform="translate(256, 130)" filter="url(#glow)">
    <!-- Vertical flare -->
    <path d="M 0 -60 L 0 60" stroke="url(#spark-grad)" stroke-width="12" stroke-linecap="round" />
    <!-- Horizontal flare -->
    <path d="M -60 0 L 60 0" stroke="url(#spark-grad)" stroke-width="12" stroke-linecap="round" />
    <!-- Secondary soft cross flares -->
    <path d="M -30 -30 L 30 30" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <path d="M 30 -30 L -30 30" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <!-- Diamond core -->
    <polygon points="0,-16 16,0 0,16 -16,0" fill="#ffffff" />
    <!-- Inner bright sun core -->
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>

  <!-- Brand text at bottom -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">PSAT MASTER</text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="6">COMMUNITY EDITION</text>
</svg>
